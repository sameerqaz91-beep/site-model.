name: viewer

on:
  push:
    paths: ["viewer/**", "tools/**", ".github/workflows/viewer.yml"]
  pull_request:
    paths: ["viewer/**", "tools/**", ".github/workflows/viewer.yml"]

jobs:
  converters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ezdxf==1.4.5 shapely==2.2.0
      - run: python -m unittest discover tools/tests -v

  viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
